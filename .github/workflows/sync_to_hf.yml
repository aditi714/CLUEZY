name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if ! head -n 1 README.md | grep -q "^---"; then
            cat << 'EOF' > /tmp/hf_frontmatter.md
          ---
          title: Cluezy Backend API
          emoji: 🔍
          colorFrom: green
          colorTo: green
          sdk: gradio
          sdk_version: 4.44.0
          app_file: app.py
          pinned: false
          ---

          EOF
            cat /tmp/hf_frontmatter.md README.md > /tmp/README_hf.md
            mv /tmp/README_hf.md README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: inject Hugging Face Space frontmatter for HF deployment"
          fi
          git push -f https://oauth2:$HF_TOKEN@huggingface.co/spaces/Parth33/cluezy-backend HEAD:main
